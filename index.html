<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мессенджер</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f7;--card:#fff;--ink:#111418;--mute:#7b828e;--acc:#2f7bff;--bubble:#cfe6ff;--mine:#2f7bff;--navbg:rgba(255,255,255,.82);--cap:rgba(20,30,50,.10);--line:rgba(0,0,0,.06);--red:#ff4a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1b1e23;--ink:#f2f4f8;--mute:#8c94a1;--bubble:#25303f;--navbg:rgba(38,41,47,.82);--cap:rgba(255,255,255,.14);--line:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg:#101215;--card:#1b1e23;--ink:#f2f4f8;--mute:#8c94a1;--bubble:#25303f;--navbg:rgba(38,41,47,.82);--cap:rgba(255,255,255,.14);--line:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
h1{font-size:28px;font-weight:800;margin:0;padding:18px 20px 10px}
.page{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px;display:none}
.page.on{display:block;animation:in .3s ease both}
.page.l{--dx:-28px}.page.r{--dx:28px}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer}
.row:active{background:var(--line)}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;position:relative}
.on-dot::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#2ecc71;border:2.5px solid var(--bg)}
.mid{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px}
.sub{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{text-align:right;font-size:12px;color:var(--mute)}
.pill{display:inline-block;min-width:22px;padding:2px 7px;border-radius:11px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;margin-top:5px;text-align:center}
.card{background:var(--card);border-radius:22px;margin:0 16px 14px;overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-weight:600;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.25s;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.25s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.prof{text-align:center;padding:10px 20px 20px}
.prof .av{width:100px;height:100px;font-size:36px;margin:0 auto 12px}
.prof input{display:block;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:center}
.prof .n{font-size:24px;font-weight:800}.prof .s{color:var(--mute);margin-top:4px}
.fld{padding:13px 18px;border-bottom:1px solid var(--line)}
.fld:last-child{border:0}
.fld small{color:var(--mute);display:block;margin-bottom:3px}
.fld input{width:100%;border:0;background:transparent;color:var(--ink);font:600 16px Manrope,system-ui,sans-serif;padding:0;outline:0}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 24px));height:70px;transform:translateX(-50%);border-radius:35px;background:var(--navbg);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 34px rgba(0,0,0,.16),inset 0 0 0 1px rgba(255,255,255,.35);display:flex;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none;z-index:5;transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.nav.hide{transform:translate(-50%,130px)}
.cap{position:absolute;left:0;top:6px;height:58px;border-radius:29px;background:var(--cap);will-change:transform;transition:transform .5s cubic-bezier(.34,1.45,.5,1),background .2s;pointer-events:none}
.cap.drag{transition:background .2s,scale .2s;scale:1.07;background:var(--cap);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink);transition:color .2s}
.tab svg{width:28px;height:28px;transition:transform .25s}
.tab.on{color:var(--acc)}.tab.on svg{transform:scale(1.12)}
.bdg{position:absolute;top:4px;left:calc(50% + 2px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--navbg)}
.bdg:empty{display:none}
/* chat */
#chat{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.3,.9,.3,1);z-index:8}
#chat.open{transform:none}
.top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card)}
.top button{border:0;background:none;color:var(--acc);font-size:30px;line-height:1;padding:0 6px;cursor:pointer}
.top .av{width:40px;height:40px;font-size:15px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--bubble);align-self:flex-start;line-height:1.35;animation:pop .25s ease both;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--mine);color:#fff}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.in{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card)}
.in input{flex:1;border:0;border-radius:22px;background:var(--bg);color:var(--ink);padding:12px 16px;font:inherit;outline:0}
.in button{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:20px;cursor:pointer}
/* Aero glass nav */
:root{--ng:linear-gradient(180deg,rgba(238,248,255,.72),rgba(175,218,250,.42) 50%,rgba(120,185,240,.38) 51%,rgba(205,235,255,.62));--nb:rgba(15,55,110,.5);--on:#06397a;--ts:0 1px 0 rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ng:linear-gradient(180deg,rgba(100,132,175,.65),rgba(35,58,95,.58) 50%,rgba(12,28,58,.62) 51%,rgba(45,82,135,.62));--nb:rgba(0,0,0,.7);--on:#fff;--ts:0 1px 2px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--ng:linear-gradient(180deg,rgba(100,132,175,.65),rgba(35,58,95,.58) 50%,rgba(12,28,58,.62) 51%,rgba(45,82,135,.62));--nb:rgba(0,0,0,.7);--on:#fff;--ts:0 1px 2px rgba(0,0,0,.6)}
.nav{background:var(--ng);-webkit-backdrop-filter:blur(16px) saturate(1.9);backdrop-filter:blur(16px) saturate(1.9);box-shadow:0 0 0 1px var(--nb),inset 0 0 0 1px rgba(255,255,255,.75),inset 0 -12px 20px rgba(70,160,255,.28),0 14px 32px rgba(15,70,150,.38);overflow:hidden}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.1));border-radius:35px 35px 60% 60%/35px 35px 14px 14px;pointer-events:none}
.nav::after{content:"";position:absolute;top:-30%;left:6%;width:14%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:rotate(18deg);pointer-events:none}
.cap{z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,rgba(165,218,255,.6) 49%,rgba(55,150,240,.6) 50%,rgba(140,226,255,.85) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 0 0 1px rgba(20,80,160,.5),0 0 14px rgba(70,170,255,.65),inset 0 -6px 10px rgba(0,120,255,.3)}
.cap::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:26px 26px 50% 50%/22px 22px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.1))}
.cap.drag{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(175,225,255,.65) 49%,rgba(60,160,250,.65) 50%,rgba(150,235,255,.9) 100%);box-shadow:inset 0 0 0 1px #fff,0 0 0 1px rgba(20,80,160,.55),0 0 24px rgba(70,180,255,.95),0 6px 18px rgba(20,90,200,.35),inset 0 -6px 10px rgba(0,120,255,.3)}
.tab{text-shadow:var(--ts)}
.tab svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tab.on{color:var(--on)}
.bdg{background:radial-gradient(circle at 50% 15%,#ff9d8f,#ff3b2a 55%,#c01408);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 1px 4px rgba(120,0,0,.5);text-shadow:0 1px 1px rgba(0,0,0,.4)}
/* Aero everywhere */
:root{--wp:radial-gradient(circle at 18% 6%,rgba(255,255,255,.75),transparent 24%),radial-gradient(ellipse at 100% 20%,rgba(120,255,210,.65),transparent 50%),radial-gradient(ellipse at 0% 75%,rgba(255,255,255,.25),transparent 50%),linear-gradient(165deg,#1b64c8 0%,#3fa9ee 38%,#7fd8ee 68%,#a8f0cf 100%);--gl:linear-gradient(180deg,rgba(255,255,255,.84),rgba(222,240,255,.62));--bi:linear-gradient(180deg,#fff,#dcecf9);--bt:#12202f;--ib:rgba(255,255,255,.92);--hd:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wp:radial-gradient(circle at 18% 6%,rgba(120,180,255,.35),transparent 26%),radial-gradient(ellipse at 100% 25%,rgba(40,170,160,.4),transparent 50%),linear-gradient(165deg,#060f2a 0%,#0c2a5c 45%,#0d4a62 100%);--gl:linear-gradient(180deg,rgba(75,108,155,.68),rgba(20,38,70,.7));--bi:linear-gradient(180deg,#4f76a8,#2a4a78);--bt:#fff;--ib:rgba(8,20,45,.7)}}
:root[data-theme="dark"]{--wp:radial-gradient(circle at 18% 6%,rgba(120,180,255,.35),transparent 26%),radial-gradient(ellipse at 100% 25%,rgba(40,170,160,.4),transparent 50%),linear-gradient(165deg,#060f2a 0%,#0c2a5c 45%,#0d4a62 100%);--gl:linear-gradient(180deg,rgba(75,108,155,.68),rgba(20,38,70,.7));--bi:linear-gradient(180deg,#4f76a8,#2a4a78);--bt:#fff;--ib:rgba(8,20,45,.7)}
body,button,input{font-family:"Segoe UI","Open Sans",system-ui,sans-serif}
body{background:var(--wp) fixed no-repeat;background-size:cover}
h1{color:#fff;font-weight:600;letter-spacing:.2px;text-shadow:0 0 14px rgba(0,70,160,.9),0 1px 2px rgba(0,30,80,.6)}
#chats,#contacts,.card{margin:0 14px 14px;border-radius:14px;overflow:hidden;background:var(--gl);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:0 0 0 1px var(--nb),inset 0 0 0 1px rgba(255,255,255,.7),0 8px 22px rgba(10,60,130,.3);position:relative}
#chats::before,#contacts::before,.card::before{content:"";position:absolute;left:0;right:0;top:0;height:36px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.row+.row{border-top:1px solid rgba(15,55,110,.13)}
.row:active{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(150,210,255,.55));box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.set{border-bottom:1px solid rgba(15,55,110,.13)}
.av{border-radius:12px;box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 3px rgba(15,55,110,.4),0 2px 6px rgba(0,30,80,.35);text-shadow:0 1px 2px rgba(0,0,0,.4);overflow:visible}
.av::before{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.12) 50%,rgba(0,0,0,.08) 51%,rgba(255,255,255,.18) 100%);pointer-events:none}
.on-dot::after{border-color:#fff;background:radial-gradient(circle at 40% 30%,#b5ffb0,#2ecc2e 70%);box-shadow:0 0 6px rgba(60,230,60,.9)}
.prof .av{border-radius:24px}.prof .av::before{border-radius:24px}
.prof input{color:#fff;font-weight:600;text-shadow:0 0 12px rgba(0,70,160,.9),0 1px 2px rgba(0,30,80,.6)}
.prof .s{color:#e8fbff;text-shadow:0 1px 2px rgba(0,30,80,.6)}
.fld input{color:var(--ink);font-family:inherit}
.pill{background:linear-gradient(180deg,#9fd8ff 0%,#2b8cf0 50%,#1670d8 51%,#5cc2ff 100%);box-shadow:0 0 0 1px rgba(255,255,255,.85),0 1px 3px rgba(0,40,100,.55);text-shadow:0 1px 1px rgba(0,40,100,.6)}
.sw{background:linear-gradient(180deg,#98a8ba,#cdd9e5);box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 1px rgba(15,55,110,.4)}
.sw.on{background:linear-gradient(180deg,#a4ee9d 0%,#38bd38 50%,#22a022 51%,#78e069 100%);box-shadow:inset 0 1px 3px rgba(0,60,0,.4),0 0 0 1px rgba(10,90,10,.55),0 0 8px rgba(70,220,70,.6)}
.sw::after{background:linear-gradient(180deg,#fff,#d3e0ec);box-shadow:0 0 0 1px rgba(15,55,110,.45),0 2px 3px rgba(0,0,0,.3)}
#chat{background:var(--wp) fixed no-repeat;background-size:cover}
.top,.in{background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:relative}
.top{box-shadow:0 1px 0 var(--nb),0 6px 16px rgba(10,60,130,.25)}
.in{box-shadow:0 -1px 0 var(--nb),0 -6px 16px rgba(10,60,130,.2)}
.top button{color:var(--on);text-shadow:var(--ts)}
.top .av{border-radius:10px}.top .av::before{border-radius:10px}
.m{position:relative;overflow:hidden;border-radius:10px;background:var(--bi);color:var(--bt);box-shadow:0 0 0 1px rgba(15,55,110,.4),0 2px 5px rgba(0,40,100,.25)}
.m::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none}
.m.me{background:linear-gradient(180deg,#9bd6ff 0%,#3b9bf0 49%,#1f7fe0 50%,#5cc2ff 100%);color:#fff;text-shadow:0 1px 1px rgba(0,50,120,.6);box-shadow:0 0 0 1px #1a5fb0,0 2px 5px rgba(0,40,100,.3)}
.in input{border-radius:8px;background:var(--ib);color:var(--bt);box-shadow:inset 0 2px 4px rgba(0,40,100,.25),0 0 0 1px var(--nb)}
.in button{width:50px;border-radius:9px;background:linear-gradient(180deg,#a5dbff 0%,#3b9bf0 49%,#1f7fe0 50%,#5cc2ff 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px #1a5fb0,0 2px 6px rgba(0,60,150,.4);text-shadow:0 1px 1px rgba(0,50,120,.6)}
/* v3 features */
.srch{display:block;width:calc(100% - 28px);margin:0 14px 12px;padding:11px 14px;border:0;border-radius:10px;background:var(--ib);color:var(--bt);font-size:15px;outline:0;box-shadow:inset 0 2px 4px rgba(0,40,100,.25),0 0 0 1px var(--nb)}
.plus{width:40px;height:40px;border:0;border-radius:12px;color:#fff;font-size:26px;line-height:1;background:linear-gradient(180deg,#a5dbff 0%,#3b9bf0 49%,#1f7fe0 50%,#5cc2ff 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px #1a5fb0,0 2px 8px rgba(0,60,150,.4);text-shadow:0 1px 1px rgba(0,50,120,.6)}
.empty{padding:22px;text-align:center;color:var(--mute)}
.ov{position:absolute;inset:0;z-index:20;background:rgba(0,30,70,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.menu,.dlg,.toast{background:var(--gl);color:var(--ink);border-radius:14px;box-shadow:0 0 0 1px var(--nb),inset 0 0 0 1px rgba(255,255,255,.7),0 12px 30px rgba(0,40,100,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.menu{position:absolute;min-width:210px;padding:4px;animation:pop .18s ease both}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:12px 16px;font:600 15px inherit;border-radius:9px}
.menu button:active{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(150,210,255,.55))}
.dlg{position:absolute;left:50%;top:36%;transform:translateX(-50%);width:min(86%,360px);padding:18px;display:grid;gap:12px;animation:pop .2s ease both}
.dlg b{font-size:17px}.dlg input{border:0;border-radius:8px;padding:12px;background:var(--ib);color:var(--bt);font-size:16px;outline:0;box-shadow:inset 0 2px 4px rgba(0,40,100,.25),0 0 0 1px var(--nb)}
.dlg .bt{display:flex;gap:10px;justify-content:flex-end}
.dlg .bt button{border:0;border-radius:9px;padding:10px 18px;font:700 14px inherit;color:var(--ink);background:linear-gradient(180deg,#fff,#d3e0ec);box-shadow:0 0 0 1px var(--nb)}
.dlg .bt .ok{color:#fff;background:linear-gradient(180deg,#a5dbff 0%,#3b9bf0 49%,#1f7fe0 50%,#5cc2ff 100%);box-shadow:0 0 0 1px #1a5fb0;text-shadow:0 1px 1px rgba(0,50,120,.6)}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:88%;padding:10px 16px;z-index:30;font-weight:600;font-size:14px;animation:drop .3s ease both}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes drop{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translateX(-50%)}}
.m span{position:relative}
.tm{display:block;text-align:right;font-size:10.5px;opacity:.7;margin-top:2px}
.typ i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a7fa8;margin:3px 2px;animation:bn 1s infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.in .eb{width:40px;background:none;box-shadow:none;font-size:25px;padding:0}
.emo{display:none;flex-wrap:wrap;gap:2px;padding:8px 10px;background:var(--gl);box-shadow:0 -1px 0 var(--nb)}
.emo.show{display:flex}.emo button{border:0;background:none;font-size:27px;padding:4px 6px}
.wps,.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 14px 14px}
.sts{grid-template-columns:repeat(3,1fr)}
.wps button,.sts button{height:62px;border-radius:10px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--nb);color:#fff;font:700 12px inherit;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:0 0 5px}
.sts button{height:44px;align-items:center;padding:0;color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,#d3e0ec)}
.wps .sel,.sts .sel{box-shadow:0 0 0 1px var(--nb),0 0 14px #5cf}
#app{overflow:hidden;overflow:clip}
.dlg{left:0;right:0;margin:0 auto;transform:none;top:18%}
.set.tap{cursor:pointer}.set.tap:active{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(150,210,255,.55))}
.m{font-size:var(--fs,16px)}
.qt{position:relative;border-left:3px solid var(--acc);background:rgba(0,40,100,.1);padding:3px 8px;border-radius:6px;font-size:12.5px;opacity:.9;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.m.me .qt{border-color:#fff;background:rgba(255,255,255,.22)}
.rx{margin-top:3px;display:inline-flex;gap:2px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.6);position:relative}
.rx .mo svg{width:1.15em;height:1.15em}
.dsep{align-self:center;padding:3px 12px;border-radius:10px;background:var(--gl);font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 0 0 1px var(--nb);margin:4px 0}
.rb{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--gl);border-left:3px solid var(--acc);color:var(--ink);font-size:13px}
.rb.show{display:flex}.rb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb button{border:0;background:none;color:var(--ink);font-size:18px}
.rxr{display:flex;gap:2px;justify-content:center;padding:6px 4px 4px;border-bottom:1px solid rgba(15,55,110,.13)}

  var ord=PEOPLE.map(function(p,i){return i}).filter(function(i){var p=PEOPLE[i];return(!Q||p.n.toLowerCase().indexOf(Q)>-1)&&(window.chipOk?chipOk(p):true)});
  ord.sort(function(a,b){return(PEOPLE[b].pin?1:0)-(PEOPLE[a].pin?1:0)||a-b});
  if(!ord.length)box.appendChild(el('div','empty','Ничего не найдено. Нажмите ＋, чтобы начать новый чат.'));
  ord.forEach(function(i){var p=PEOPLE[i],l=p.m[p.m.length-1]||['Нет сообщений',0];
    var r=el('div','row',avHTML(p)+'<div class="mid"><div class="nm"></div><div class="sub"></div></div><div class="meta"></div>');
    r.querySelector('.nm').textContent=(p.pin?'📌 ':'')+p.n+(p.blk?' 🚫':'');r.querySelector('.sub').textContent=p.d?'✎ Черновик: '+p.d:(l[1]?'Вы: ':'')+l[0];
    r.querySelector('.meta').innerHTML=p.t+(p.mute?' 🔕':'')+(p.u?'<br><span class="pill">'+p.u+'</span>':'');
    press(r,function(){openChat(i)},function(x,y){chatMenu(i,x,y,r)});box.appendChild(r)});
  badge();save()}
function bubble(m,k){var d=el('div','m'+(m[1]?' me':'')),s=el('span'),tm=el('span','tm');s.textContent=m[0];
  tm.textContent=(m[2]||'')+(m[1]?(m[3]?' ✓✓':' ✓'):'');d.appendChild(s);d.appendChild(tm);
  press(d,null,function(x,y){if(window.msgMenu)return msgMenu(m,k,x,y);menu([['Копировать',function(){try{navigator.clipboard.writeText(m[0])}catch(e){}toast('Скопировано')}],['Удалить сообщение',function(){PEOPLE[open].m.splice(k,1);drawMsgs();renderChats()}]],x,y)});
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}

  $('c-nm').textContent=p.n;$('c-st').textContent=p.on?'в сети':'был(а) недавно';drawMsgs();
  $('chat').classList.add('open');nav.classList.add('hide');$('emo').classList.remove('show');renderChats()}
